name: Validate learning content

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_content.ps1

      - name: Validate with PowerShell 7
        shell: pwsh
        run: ./scripts/validate_content.ps1
